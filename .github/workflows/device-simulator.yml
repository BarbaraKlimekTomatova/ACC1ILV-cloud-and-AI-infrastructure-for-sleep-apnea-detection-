# device-simulator CI: unit tests (no Kafka needed)
name: device-simulator

on:
  push:
    paths:
      - "services/device-simulator/**"
      - "tests/device-simulator/**"
      - "kafka/schemas/**"
      - "data/03_to_kafka_messages.py"
      - "data/clean/**"
      - ".github/workflows/device-simulator.yml"
  pull_request:
    paths:
      - "services/device-simulator/**"
      - "tests/device-simulator/**"
      - "kafka/schemas/**"
      - "data/03_to_kafka_messages.py"
      - "data/clean/**"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r services/device-simulator/requirements.txt pytest==8.3.4
      # the .jsonl files are not in git, so the test on a real night is skipped here
      - name: Tests
        run: pytest tests/device-simulator

  # the image must build from git only: the nights are made inside the build (no kafka/messages/)
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f services/device-simulator/Dockerfile -t device-simulator:ci .
      - name: The 5 demo nights are in the image
        run: |
          docker run --rm --entrypoint sh device-simulator:ci -c 'ls kafka/messages/raw-signals/*.jsonl | wc -l' | grep -qx 5
          docker run --rm device-simulator:ci --dry-run --burst | tail -n 3
