# Local development: PostgreSQL + Kafka (+ topic creation), carbon-scheduler, alert-check, alert-service
# (always on), apnea-detector, ahi-triage, device-simulator (profiles: detector, triage, sim)
#
#   start:            docker compose up --build  (add -d to run in the background)
#   everything:       docker compose --profile detector --profile triage --profile sim up --build
#   stop:             docker compose down
#   start from zero:  docker compose down -v     (deletes the database; db/init/ runs again on next start)
#
# How to connect
#   from your laptop (notebook, Kafkaesque):  postgres -> localhost:5432   kafka -> localhost:9092
#   from a service inside Docker (Step 3):    postgres -> postgres:5432    kafka -> kafka:29092

services:

  # ---------------------------------------------------------------- PostgreSQL
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: sleep_apnea
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres            # local development only
    ports: ["5432:5432"]
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro   # Step 1 SQL files, run in number order on the FIRST start
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sleep_apnea"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ---------------------------------------------------------------- Kafka (KRaft, 1 broker)
  kafka:
    image: apache/kafka:latest
    ports: ["9092:9092"]
    environment:
      CLUSTER_ID: sleep-apnea-local-01
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller           # KRaft: no ZooKeeper
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # two listeners: one for Docker services, one for the laptop
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # only one broker, so every internal topic has 1 copy
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"         # only our 5 topics, no typos creating new ones
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:29092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30

  # ---------------------------------------------------------------- create the 5 topics, then exit
  kafka-init:
    image: apache/kafka:latest
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        T=/opt/kafka/bin/kafka-topics.sh
        B=kafka:29092
        # raw-signals has 3 partitions so up to 3 apnea-detector pods can share the work
        $$T --bootstrap-server $$B --create --if-not-exists --topic raw-signals   --partitions 3 --replication-factor 1
        $$T --bootstrap-server $$B --create --if-not-exists --topic alerts        --partitions 1 --replication-factor 1
        $$T --bootstrap-server $$B --create --if-not-exists --topic apnea-events  --partitions 1 --replication-factor 1
        $$T --bootstrap-server $$B --create --if-not-exists --topic night-results --partitions 1 --replication-factor 1
        $$T --bootstrap-server $$B --create --if-not-exists --topic carbon-signal --partitions 1 --replication-factor 1
        echo "Topics:"
        $$T --bootstrap-server $$B --list

  # ---------------------------------------------------------------- apnea-detector (optional)
  # needs models/model.joblib first (services/model-trainer), start with:
  #   docker compose --profile detector up --build apnea-detector
  apnea-detector:
    profiles: ["detector"]
    build:
      context: .
      dockerfile: services/apnea-detector/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      DATABASE_URL: postgresql://apnea_detector:dev_apnea_detector@postgres:5432/sleep_apnea
      DEFAULT_CARBON_MODE: low_carbon
      # demo: act as if it were this time (night 23:00 -> pause in high_carbon, 06:30 -> fast model)
      DEMO_TIME: ""
    ports: ["8000:8000"]                                 # Prometheus /metrics

  # ---------------------------------------------------------------- ahi-triage (optional)
  # reads apnea-events, writes results, sends night-results. Start with:
  #   docker compose --profile triage up --build ahi-triage
  ahi-triage:
    profiles: ["triage"]
    build:
      context: .
      dockerfile: services/ahi-triage/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      DATABASE_URL: postgresql://ahi_triage:dev_ahi_triage@postgres:5432/sleep_apnea
      # LLM summary from Ollama on the laptop (ollama serve; ollama pull llama3.2:1b), USE_LLM: "0" = off
      LLM_URL: http://host.docker.internal:11434
      USE_LLM: "1"
      # demo: same clock as the detector (deadline_met = finished before 08:00)
      DEMO_TIME: ""
    ports: ["8001:8001"]                                 # Prometheus /metrics

  # ---------------------------------------------------------------- carbon-scheduler (UC5)
  # simulated carbon intensity of AT / NO / PL -> carbon-signal, decisions -> carbon_decisions.
  # Demo settings: SPEED 60 = one simulated minute per second. With NO in REGIONS the mode is
  # always low_carbon; for high_carbon use REGIONS: "AT,PL" (AT is dirty at night) or FORCE_MODE.
  carbon-scheduler:
    build:
      context: .
      dockerfile: services/carbon-scheduler/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      DATABASE_URL: postgresql://carbon_scheduler:dev_carbon_scheduler@postgres:5432/sleep_apnea
      REGIONS: "AT,NO,PL"
      HIGH_CARBON_THRESHOLD: "300"                       # gCO2/kWh
      FORCE_MODE: ""                                     # low_carbon / high_carbon / empty
      CARBON_CSV: ""                                     # e.g. services/carbon-scheduler/carbon_example.csv
      SPEED: "1"                                         # simulated seconds per real second
      START_TIME: ""                                     # HH:MM, empty = now
      STEP_S: "5"
    ports: ["8004:8004"]                                 # Prometheus /metrics

  # ---------------------------------------------------------------- alert-check (UC3)
  # raw-signals (own group "alert-check", never paused) -> alerts when SpO2 < 80 %
  alert-check:
    build:
      context: .
      dockerfile: services/alert-check/Dockerfile
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      ALERT_THRESHOLD: "80"
    ports: ["8002:8002"]                                 # Prometheus /metrics

  # ---------------------------------------------------------------- alert-service (UC3)
  # alerts -> table alerts (DB user alert_service). alerts.night_id needs the raw_nights row,
  # which the apnea-detector writes: run it too (--profile detector), else alerts are dropped
  # after FK_WAIT_S seconds (logged as ERROR, alert_service_dropped_total).
  alert-service:
    build:
      context: .
      dockerfile: services/alert-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      DATABASE_URL: postgresql://alert_service:dev_alert_service@postgres:5432/sleep_apnea
      FK_WAIT_S: "60"
    ports: ["8003:8003"]                                 # Prometheus /metrics

  # ---------------------------------------------------------------- device-simulator (optional)
  # the image makes the demo nights from data/clean/ itself (services/device-simulator/Dockerfile).
  #   docker compose --profile sim up --build device-simulator
  device-simulator:
    profiles: ["sim"]
    build:
      context: .
      dockerfile: services/device-simulator/Dockerfile
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      SPEED: "60"

volumes:
  pgdata:
