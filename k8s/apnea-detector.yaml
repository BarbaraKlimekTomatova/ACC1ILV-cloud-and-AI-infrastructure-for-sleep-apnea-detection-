# apnea-detector (UC2, UC3 alert check, UC5). Owner: Barbara.
# Deployment + Service for Prometheus + HPA 1-3 pods (ADR 0003).
# The image contains models/model.joblib and models/model-fast.joblib (see services/apnea-detector/Dockerfile).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apnea-detector
  labels: {app: apnea-detector}
spec:
  replicas: 1
  selector:
    matchLabels: {app: apnea-detector}
  template:
    metadata:
      labels: {app: apnea-detector}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
    spec:
      # carbon-aware redeployment (ADR 0004): the carbon-scheduler changes this region
      # to the cleanest one, and Kubernetes moves the pod with a rolling update.
      # "preferred", so the pod still starts on a cluster without region labels.
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - {key: region, operator: In, values: ["AT"]}
      containers:
        - name: apnea-detector
          image: apnea-detector:dev
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: {name: apnea-config}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: apnea-db, key: apnea-detector}
            - name: METRICS_PORT
              value: "8000"
          ports:
            - {name: metrics, containerPort: 8000}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
          livenessProbe:
            httpGet: {path: /metrics, port: metrics}
            initialDelaySeconds: 20
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: apnea-detector
  labels: {app: apnea-detector}
spec:
  selector: {app: apnea-detector}
  ports:
    - {name: metrics, port: 8000, targetPort: metrics}
---
# 1-3 pods when many nights arrive at once (NFR scalability). raw-signals has 3 partitions,
# so a 4th pod would have nothing to read. In high_carbon the carbon-scheduler sets
# maxReplicas to 1 (ADR 0003). Needs metrics-server in the cluster.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: apnea-detector
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: apnea-detector
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}
