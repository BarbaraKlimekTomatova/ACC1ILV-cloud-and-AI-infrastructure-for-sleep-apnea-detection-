# ahi-triage (UC2 steps 6-10). Owner: Barbara.
# Exactly 1 pod: the counts of the open nights are in memory (see services/ahi-triage/README.md),
# so it does not scale out. After a restart it reads the unfinished nights again from Kafka.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ahi-triage
  labels: {app: ahi-triage}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: ahi-triage}
  template:
    metadata:
      labels: {app: ahi-triage}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8001"
    spec:
      containers:
        - name: ahi-triage
          image: ahi-triage:dev
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: {name: apnea-config}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: apnea-db, key: ahi-triage}
            - name: LLM_API_KEY                 # for the LLM summary (UC2 step 8, not built yet)
              valueFrom:
                secretKeyRef: {name: llm-api, key: api-key, optional: true}
            - name: METRICS_PORT
              value: "8001"
          ports:
            - {name: metrics, containerPort: 8001}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 250m, memory: 256Mi}
          livenessProbe:
            httpGet: {path: /metrics, port: metrics}
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: ahi-triage
  labels: {app: ahi-triage}
spec:
  selector: {app: ahi-triage}
  ports:
    - {name: metrics, port: 8001, targetPort: metrics}
